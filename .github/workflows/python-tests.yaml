name: Python Checks

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installation des bibliothèques nécessaires
          pip install pytest fastapi uvicorn pandas httpx

      - name: Prepare Workspace
        # On crée un fichier CSV avec des données permettant de tester les débits et crédits
        run: |
          mkdir -p data
          # Ajout des colonnes nécessaires pour les filtres par client (Route 7 et 8)
          echo "amount,use_chip,isFraud,nameOrig,nameDest" > data/transactions_data.csv
          # Une transaction négative pour le test de débit (Route 7)
          echo "-50.0,Swipe Transaction,0,123,456" >> data/transactions_data.csv
          # Une transaction positive pour le test de crédit (Route 8)
          echo "100.0,Chip Transaction,0,789,123" >> data/transactions_data.csv

      - name: Run Tests
        # On pointe vers 'src' pour que Python trouve ton code
        env:
          PYTHONPATH: src
        run: |
          pytest