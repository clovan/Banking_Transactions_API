[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-transactions-api"
version = "1.0.0"
description = "API de gestion des transactions bancaires pour l'équipe commerciale"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Clovis", email = "clovisleroukx@gmail.com"},
    {name = "Irmeline", email = "mguevou@gmail.com"},
    {name = "Milaine", email = "milainecabrelle@gmail.com"},
    {name = "Amina", email = "a_salimimazrag@stu-mba-esg.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

# Dépendances de production (Runtime)
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas",
    "python-dotenv",
    "numpy",
    "streamlit>=1.54.0",
]

# Dépendances de développement et tests (Qualité logicielle)
[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "httpx",
    "ruff",         # Remplace Flake8 (plus rapide)
    "mypy",         # Pour le typage statique
    "pandas-stubs", # Types pour Pandas (aide Mypy)
    "black",        # Formateur de code
]

# --- ARCHITECTURE DU PACKAGE ---
[tool.setuptools.packages.find]
where = ["src"]
include = ["banking_transaction_api*"]

# --- CONFIGURATION PYTEST ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Ajout automatique de la couverture de code lors du lancement de pytest
addopts = "-v --strict-markers --cov=src --cov-report=term-missing"

# --- CONFIGURATION RUFF (Linter moderne) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort (imports), UP: upgrade
select = ["E", "F", "I", "UP", "N"]
ignore = ["E203"] # Compatible avec Black

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- CONFIGURATION MYPY (Typage) ---
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false # On reste flexible pour l'examen
ignore_missing_imports = true
check_untyped_defs = true
